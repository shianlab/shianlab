<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 230" width="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <g>
    <rect x="40" y="55" width="215" height="135" rx="14" fill="#ffffff" stroke="#e7e9f5" stroke-width="1.5"/>
    <text x="147" y="120" text-anchor="middle" fill="url(#num)" font-size="46" font-weight="700">1600+</text>
    <text x="147" y="155" text-anchor="middle" fill="#5b6478" font-size="17">微信社群成员</text>
  </g>
  <!-- Card 2 -->
  <g>
    <rect x="269" y="55" width="215" height="135" rx="14" fill="#ffffff" stroke="#e7e9f5" stroke-width="1.5"/>
    <text x="376" y="120" text-anchor="middle" fill="url(#num)" font-size="46" font-weight="700">8</text>
    <text x="376" y="155" text-anchor="middle" fill="#5b6478" font-size="17">个活跃社群</text>
  </g>
  <!-- Card 3 -->
  <g>
    <rect x="498" y="55" width="215" height="135" rx="14" fill="#ffffff" stroke="#e7e9f5" stroke-width="1.5"/>
    <text x="605" y="120" text-anchor="middle" fill="url(#num)" font-size="46" font-weight="700">30+</text>
    <text x="605" y="155" text-anchor="middle" fill="#5b6478" font-size="17">原创 Agent 技能</text>
  </g>
  <!-- Card 4 -->
  <g>
    <rect x="727" y="55" width="215" height="135" rx="14" fill="#ffffff" stroke="#e7e9f5" stroke-width="1.5"/>
    <text x="834" y="120" text-anchor="middle" fill="url(#num)" font-size="46" font-weight="700">4</text>
    <text x="834" y="155" text-anchor="middle" fill="#5b6478" font-size="17">大公开知识库</text>
  </g>
  <!-- Card 5 -->
  <g>
    <rect x="956" y="55" width="215" height="135" rx="14" fill="#ffffff" stroke="#e7e9f5" stroke-width="1.5"/>
    <text x="1063" y="120" text-anchor="middle" fill="url(#num)" font-size="46" font-weight="700">3</text>
    <text x="1063" y="155" text-anchor="middle" fill="#5b6478" font-size="17">个开源项目</text>
  </g>
  <!-- Card 6 -->
  <g>
    <rect x="1185" y="55" width="215" height="135" rx="14" fill="#ffffff" stroke="#e7e9f5" stroke-width="1.5"/>
    <text x="1292" y="120" text-anchor="middle" fill="url(#num)" font-size="46" font-weight="700">2</text>
    <text x="1292" y="155" text-anchor="middle" fill="#5b6478" font-size="17">个 AI 社区共建身份</text>
  </g>
</svg>
